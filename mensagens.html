<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensagens dos visitantes</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="mural">

<!-- ==========================================================
     MURAL DE MENSAGENS
     Este arquivo aparece dentro do site (na seção Sugestões).

     Para publicar uma mensagem nova:
     1. Copie um bloco <article class="msg"> inteiro.
     2. Cole no TOPO da lista (as mais novas ficam em cima).
     3. Troque a inicial, o --h (cor da bolinha, 0 a 360), o nome e o texto.

     Cuidado: escreva a mensagem como texto simples. Não cole HTML
     que veio de visitantes, para ninguém colocar código estranho no seu site.
     As duas mensagens abaixo são de exemplo: apague quando quiser.
     ========================================================== -->

<div class="lista-msgs">

  <article class="msg">
    <p class="msg-texto">Adorei o estilo do personagem de cabelo rosa! Quando sai o próximo capítulo do webtoon?</p>
    <div class="msg-autor">
      <span class="msg-inicial" style="--h:340" aria-hidden="true">V</span>
      <b>Visitante de exemplo</b>
      <span class="msg-tag">exemplo</span>
    </div>
  </article>

  <article class="msg">
    <p class="msg-texto">Sugestão: seria legal ter um modo difícil no jogo de mistério. Parabéns pelo trabalho!</p>
    <div class="msg-autor">
      <span class="msg-inicial" style="--h:215" aria-hidden="true">M</span>
      <b>Maria (exemplo)</b>
      <span class="msg-tag">exemplo</span>
    </div>
  </article>

</div>

</body>
</html>
